<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Нэвтрэх | Брэндийн самбар</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='brand.css') }}">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-brand" aria-label="Брэндийн танилцуулга">
      <span class="wordmark">TOUCHLINE</span>
      <div class="login-brand-copy">
        <h2>Брэндийн нэгдсэн самбар</h2>
        <p>Постын нооргоо нэг дороос удирдана.</p>
      </div>
    </section>
    <section class="login-card">
      <h1>Нэвтрэх</h1>
      <p class="login-intro">Ноорог постуудаа харахын тулд бүртгэлээрээ нэвтэрнэ үү.</p>
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="flash-message" role="alert">{{ message }}</div>
    {% endfor %}
    <form method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label class="field-label" for="email">И-мэйл хаяг</label>
      <input class="text-input" id="email" name="email" type="email" autocomplete="username" required>
      <label class="field-label" for="password">Нууц үг</label>
      <input class="text-input" id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="primary-button" type="submit">Самбарт нэвтрэх</button>
    </form>
    </section>
  </main>
</body>
</html>
